<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 450" role="img" aria-labelledby="t d">
  <title id="t">OnePlus Nord 2 5G reference illustration</title>
  <desc id="d">A phone seen from the front and from the back, drawn in paper tones.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C3D5BD"/>
      <stop offset="1" stop-color="#8CAA90"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E3"/>
      <stop offset="1" stop-color="#EBE1CB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="190" cy="425" rx="130" ry="12" fill="#6b4a2a" opacity=".22" filter="url(#soft)"/>

  <!-- BACK phone -->
  <g transform="translate(196 34) rotate(7 80 170)">
    <rect x="-3" y="60" width="4" height="34" rx="2" fill="#7e9a82"/>
    <rect width="160" height="344" rx="28" fill="url(#back)"/>
    <rect width="160" height="344" rx="28" fill="url(#sheen)"/>
    <rect x=".75" y=".75" width="158.5" height="342.5" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
    <!-- camera island -->
    <rect x="14" y="14" width="58" height="112" rx="29" fill="#F2EBD9" fill-opacity=".92"/>
    <rect x="14" y="14" width="58" height="112" rx="29" fill="none" stroke="#2B2420" stroke-opacity=".18"/>
    <g>
      <circle cx="43" cy="44" r="15" fill="#2B2420"/>
      <circle cx="43" cy="44" r="10" fill="#4a3d35"/>
      <circle cx="39" cy="40" r="3" fill="#fff" fill-opacity=".55"/>
      <circle cx="43" cy="80" r="13" fill="#2B2420"/>
      <circle cx="43" cy="80" r="8.5" fill="#4a3d35"/>
      <circle cx="40" cy="77" r="2.4" fill="#fff" fill-opacity=".5"/>
      <circle cx="43" cy="110" r="7" fill="#2B2420"/>
      <circle cx="41" cy="108" r="1.6" fill="#fff" fill-opacity=".5"/>
    </g>
    <circle cx="60" cy="26" r="3.4" fill="#fff" stroke="#2B2420" stroke-opacity=".25"/>
    <!-- subtle lower panel line -->
    <path d="M24 300h112" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M24 312h64" stroke="#fff" stroke-opacity=".25" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- FRONT phone -->
  <g transform="translate(34 62) rotate(-6 80 170)">
    <rect x="159" y="86" width="4" height="52" rx="2" fill="#1d1815"/>
    <rect width="160" height="344" rx="30" fill="#2B2420"/>
    <rect x="7" y="7" width="146" height="330" rx="24" fill="url(#screen)"/>
    <circle cx="25" cy="24" r="5" fill="#2B2420"/>

    <!-- status bar -->
    <rect x="52" y="21" width="22" height="6" rx="3" fill="#2B2420" opacity=".55"/>
    <rect x="118" y="21" width="22" height="6" rx="3" fill="#2B2420" opacity=".55"/>

    <!-- heading -->
    <rect x="22" y="52" width="70" height="12" rx="6" fill="#2B2420" opacity=".85"/>
    <rect x="22" y="72" width="108" height="6" rx="3" fill="#2B2420" opacity=".28"/>
    <rect x="22" y="84" width="84" height="6" rx="3" fill="#2B2420" opacity=".2"/>

    <!-- folder tiles -->
    <g>
      <rect x="22" y="108" width="52" height="52" rx="12" fill="#fff" fill-opacity=".7" stroke="#2B2420" stroke-opacity=".12"/>
      <rect x="86" y="108" width="52" height="52" rx="12" fill="#B5532E" fill-opacity=".92"/>
      <rect x="22" y="172" width="52" height="52" rx="12" fill="#fff" fill-opacity=".7" stroke="#2B2420" stroke-opacity=".12"/>
      <rect x="86" y="172" width="52" height="52" rx="12" fill="#A9C2A3" fill-opacity=".9"/>
      <rect x="32" y="124" width="22" height="5" rx="2.5" fill="#2B2420" opacity=".5"/>
      <rect x="96" y="124" width="22" height="5" rx="2.5" fill="#fff" opacity=".85"/>
      <rect x="32" y="188" width="22" height="5" rx="2.5" fill="#2B2420" opacity=".5"/>
      <rect x="96" y="188" width="22" height="5" rx="2.5" fill="#2B2420" opacity=".5"/>
    </g>

    <!-- file rows -->
    <rect x="22" y="240" width="116" height="26" rx="13" fill="#fff" fill-opacity=".7" stroke="#2B2420" stroke-opacity=".1"/>
    <circle cx="36" cy="253" r="5" fill="#B5532E"/>
    <rect x="48" y="250" width="56" height="5" rx="2.5" fill="#2B2420" opacity=".4"/>
    <rect x="22" y="272" width="116" height="26" rx="13" fill="#fff" fill-opacity=".7" stroke="#2B2420" stroke-opacity=".1"/>
    <circle cx="36" cy="285" r="5" fill="#8CAA90"/>
    <rect x="48" y="282" width="44" height="5" rx="2.5" fill="#2B2420" opacity=".4"/>

    <!-- nav pill -->
    <rect x="58" y="320" width="44" height="4" rx="2" fill="#2B2420" opacity=".4"/>

    <!-- glass glare -->
    <path d="M7 31 Q7 7 31 7 H92 L7 150 Z" fill="url(#glass)" opacity=".7"/>
  </g>
</svg>
